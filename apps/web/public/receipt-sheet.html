<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https:; worker-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light"><title>Add receipt · HostelPalika</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#ffffff">
<style>
:root{font-family:system-ui,sans-serif;color:#13201a;background:#ffffff;--line:#dfe8e3;--muted:#5f7068;--brand:#0a8a4b;--soft:#e8f6ee;--bad:#c2341f;--bad-soft:#fdeceb}*{box-sizing:border-box}body{margin:0}main{max-width:440px;margin:auto;padding:18px 22px max(22px,env(safe-area-inset-bottom));animation:enter .2s ease-out}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{background:var(--soft);color:var(--brand);border-radius:12px;width:42px;height:42px;display:grid;place-content:center;font-weight:800;flex:none}h1{font-size:19px;margin:0;line-height:1.25}header .file{margin:2px 0 0;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}p{color:var(--muted);line-height:1.45;margin:5px 0;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;min-height:48px;border-radius:14px;border:1px solid var(--line);background:transparent;color:inherit;padding:10px 18px}button:disabled{opacity:.55;cursor:default}.primary{background:var(--brand);color:white;border:0;font-weight:650}.actions{display:flex;gap:10px;margin-top:22px}.actions>*{flex:1}label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px;background:transparent;color:inherit;color-scheme:light}input:focus,select:focus{border-color:var(--brand);outline:none}.big{font-size:40px;font-weight:650;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0 10px;font-variant-numeric:tabular-nums}.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;margin-top:20px}.check input{width:20px;min-height:20px;margin:0;accent-color:var(--brand)}.scan{height:84px;display:grid;place-content:center;background:#f2f8f4;border-radius:16px;position:relative;overflow:hidden;margin:4px 0 12px}.scan:after{content:"";height:2px;background:#14a35c;position:absolute;left:15%;right:15%;top:20%;animation:scan 1.4s ease-in-out infinite alternate}.scan b{font-size:28px;color:var(--brand)}#status{min-height:22px;font-size:14px}details{margin:18px 0 0}summary{cursor:pointer;font-size:14px;color:var(--muted);padding:8px 0}#error{color:var(--bad)}#hint{color:#9a5b00;font-size:13px}#done{text-align:center;padding:22px 0 6px}#doneIcon{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-content:center;font-size:32px;font-weight:700;background:var(--soft);color:var(--brand)}#doneIcon.bad{background:var(--bad-soft);color:var(--bad)}#done h1{font-size:21px}#doneText{max-width:320px;margin:6px auto 0}[hidden]{display:none!important}.file{overflow-wrap:anywhere;font-size:12px}#pick{margin-top:14px;width:100%}a{color:var(--brand)}.for{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f4f8f6;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}.for b{font-weight:650}.for span{color:var(--muted)}@keyframes scan{to{top:80%}}@keyframes enter{from{opacity:.5;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:focus-visible{outline:3px solid #75d8a3;outline-offset:2px}
.lab{display:flex;align-items:center;gap:6px;margin:12px 0 6px}.lab label{margin:0}.auto{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--soft);border-radius:5px;padding:2px 5px;line-height:1.3}.pick{width:100%;min-height:46px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;text-align:left}.pick .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.pick .chev{margin-left:auto;color:var(--muted);font-size:12px}.logo{width:28px;height:28px;border-radius:8px;border:1px solid #e6ebe8;background:#fff;display:grid;place-content:center;flex:none;overflow:hidden;color:var(--muted)}.logo img{width:22px;height:22px;object-fit:contain;display:block}.logo svg{width:16px;height:16px}#menuTitle{font-size:13px;margin:4px 0 4px}#menu .opt{width:100%;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px;min-height:56px;text-align:left}#menu .opt:last-child{border-bottom:0}#menu .opt .logo{width:38px;height:38px;border-radius:11px}#menu .opt .logo img{width:30px;height:30px}#menu .opt .logo svg{width:20px;height:20px}#menu .opt[aria-selected=true]{color:var(--brand);font-weight:650}#menu .tick{margin-left:auto}
:root.sheet{background:transparent}.sheet body{background:#fff;border-radius:22px 22px 0 0;min-height:100vh}.sheet main::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 16px}
</style></head><body><main>
<header><span class="mark" aria-hidden="true">HP</span><div><h1 id="title">Add receipt</h1><p id="file" class="file" hidden></p></div></header>
<div id="scan" class="scan" aria-hidden="true"><b>▤</b></div>
<p id="status" role="status" aria-live="polite">Reading receipt…</p>
<p id="error" role="alert" hidden></p>
<form id="form" hidden>
<label for="amount">Amount · Rs.</label><input id="amount" class="big" inputmode="numeric" type="number" min="1" max="100000000" step="1" required>
<div class="row"><div><div class="lab"><label for="category">Category</label><span class="auto" id="categoryAuto" hidden>Auto</span></div><select id="category"><option value="OTHER">Other</option><option value="GROCERIES">Groceries</option><option value="VEGETABLES_MEAT">Vegetables &amp; meat</option><option value="GAS">Gas</option><option value="ELECTRICITY">Electricity</option><option value="WATER">Water</option><option value="INTERNET">Internet</option><option value="SALARY">Salary</option><option value="RENT">Building rent</option><option value="REPAIR">Repair</option><option value="CLEANING">Cleaning</option></select></div>
<div><div class="lab"><label for="methodPick">Paid by</label><span class="auto" id="methodAuto" hidden>Auto</span></div><button type="button" id="methodPick" class="pick"></button><select id="method" hidden><option value="BANK">Bank</option><option value="ESEWA">eSewa</option><option value="KHALTI">Khalti</option><option value="CASH">Cash</option></select></div></div>
<details id="details"><summary>Details</summary><label for="what">Description</label><input id="what" maxlength="120" required>
</details>
<label class="check"><input type="checkbox" id="auto"><span>Don’t ask next time — read and save my shared receipts automatically</span></label>
</form>
<form id="rform" hidden>
<label for="ramount">Amount paid · Rs.</label><input id="ramount" class="big" inputmode="numeric" type="number" min="1" max="100000000" step="1" required>
<div id="for" class="for"><b id="forMonth"></b><span id="forDue"></span></div>
<div id="pickInvoice" hidden><label for="rinvoice">For</label><select id="rinvoice"></select></div>
<div class="row"><div><div class="lab"><label for="rmethodPick">Paid with</label><span class="auto" id="rmethodAuto" hidden>Auto</span></div><button type="button" id="rmethodPick" class="pick"></button><select id="rmethod" hidden><option value="">Choose</option><option value="ESEWA">eSewa</option><option value="KHALTI">Khalti</option><option value="FONEPAY">Fonepay</option><option value="BANK_TRANSFER">Bank</option><option value="CASH">Cash</option><option value="OTHER">Other</option></select></div>
<div><div class="lab"><label for="rtxn">Transaction ID</label></div><input id="rtxn" maxlength="120" autocapitalize="characters" autocomplete="off" spellcheck="false"></div></div>
<p id="hint" hidden></p>
</form>
<div id="menu" hidden><p id="menuTitle">Paid by</p><div id="menuList" role="listbox"></div></div>
<div id="done" hidden><div id="doneIcon" aria-hidden="true">✓</div><h1 id="doneTitle">Saved</h1><p id="doneText"></p></div>
<input id="picker" type="file" accept="image/*,application/pdf,.pdf" hidden>
<button id="pick" class="primary" hidden>Select receipt</button>
<a id="login" hidden href="/app/share-payment">Sign in to HostelPalika</a>
<div class="actions" id="actions"><button id="cancel">Cancel</button><button id="retry" hidden>Try again</button><button id="save" class="primary" form="form" type="submit" disabled hidden>Save</button><button id="send" class="primary" form="rform" type="submit" disabled hidden>Send to hostel</button></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const native = Boolean(window.ReceiptBridge || window.webkit?.messageHandlers?.receipt);
  // The standalone page bypasses Expo's entry point. Keep receiving future
  // shares locally even when this is the first page the browser opens.
  if (!native && typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
    void navigator.serviceWorker.register('/sw.js', {scope:'/app', updateViaCache:'none'}).catch(() => {});
  }
  // Android shows this page in a bottom sheet sized to the content.
  if (window.ReceiptBridge) {
    document.documentElement.classList.add('sheet');
    new ResizeObserver(() => window.ReceiptBridge.postMessage(JSON.stringify({action:'size', height:Math.ceil(document.querySelector('main').scrollHeight)}))).observe(document.querySelector('main'));
  }
  const replies = new Map(); let sequence = 0, cancelled = false, saving = false;
  window.receiptReply = ({id, value, error}) => { const reply = replies.get(id); if (!reply) return; replies.delete(id); error ? reply.reject(new Error(error)) : reply.resolve(value); };
  function bridge(action, data = {}) {
    return new Promise((resolve, reject) => {
      const id = ++sequence; replies.set(id, {resolve, reject});
      const message = JSON.stringify({id, action, ...data});
      if (window.ReceiptBridge) window.ReceiptBridge.postMessage(message);
      else window.webkit.messageHandlers.receipt.postMessage(message);
    });
  }
  const params = new URLSearchParams(location.search);
  let blob, fileName = '', assetId, requestId, prefKey, loaded = false, opening = false, resident = false, due = [];
  const shareId = params.get('share');
  $('login').href = '/app/share-payment' + (shareId ? '?share=' + encodeURIComponent(shareId) : '');
  const shareKey = /^[a-f0-9-]{36}$/.test(shareId || '') ? new URL('/app/_shared-payment/' + shareId, location.origin).href : null;
  function session() { try { return JSON.parse(localStorage.getItem('hostelpalika_session') || 'null'); } catch { return null; } }
  const branch = () => localStorage.getItem('hostelpalika.activeHostelId') || '';
  async function webRequest(path, method = 'GET', body, retry = true) {
    const tokens = session();
    const response = await fetch('/api/v1' + path, {method, credentials:'include', signal:AbortSignal.timeout(45000), headers:{'Content-Type':'application/json','x-hostelhub-client':'mobile', ...(tokens ? {Authorization:'Bearer ' + tokens.accessToken} : {}), ...(branch() ? {'x-hostel-id':branch()} : {})}, body:body ? JSON.stringify(body) : undefined});
    if (response.status === 401 && retry && tokens?.refreshToken) {
      const refresh = async () => {
        const latest = session(); if (!latest) throw new Error('Sign in to HostelPalika, then share again.');
        if (latest.refreshToken !== tokens.refreshToken) return;
        const res = await fetch('/api/v1/auth/refresh', {method:'POST', credentials:'include', signal:AbortSignal.timeout(20000), headers:{'Content-Type':'application/json','x-hostelhub-client':'mobile'},body:JSON.stringify({refreshToken:latest.refreshToken})});
        const result = await res.json(); if (!res.ok || !result.data?.accessToken || !result.data?.refreshToken) throw new Error('Sign in to HostelPalika, then share again.');
        localStorage.setItem('hostelpalika_session', JSON.stringify({accessToken:result.data.accessToken,refreshToken:result.data.refreshToken}));
      };
      await (navigator.locks ? navigator.locks.request('hostelpalika-app-refresh', refresh) : refresh());
      return webRequest(path, method, body, false);
    }
    const result = await response.json();
    if (!response.ok || !result.success) { if (response.status === 401) $('login').hidden = false; throw new Error(result.message || 'Could not finish. Try again.'); }
    return result.data;
  }
  const api = (path, method = 'GET', body) => native ? bridge('api', {path, method, body:body || {}}) : webRequest(path, method, body);
  async function cleanup() { if (!native && shareKey) await (await caches.open('hostelpalika-shared-payments-v1')).delete(shareKey); }
  async function close() {
    cancelled = true;
    if (native) { await bridge('close'); return; }
    await cleanup();
    window.close();
    location.replace(resident ? '/app/payments' : '/app/expenses');
  }
  $('cancel').onclick = () => { if (!saving) void close(); };
  $('pick').onclick = () => $('picker').click();
  $('picker').onchange = () => { const file = $('picker').files[0]; if (file && !opening && !saving) { blob = file; fileName = file.name; assetId = null; loaded = false; $('amount').value = ''; $('what').value = ''; $('form').hidden = true; $('rform').hidden = true; void open(); } };
  $('retry').onclick = () => { void open(); };
  function error(message) { $('error').textContent = message; $('error').hidden = false; }
  const kind = () => resident ? 'PAYMENT_PROOF' : 'EXPENSE_RECEIPT';
  async function upload() {
    if (native) return bridge('upload', {kind:kind()});
    const type = blob.type.toLowerCase().split(';')[0].trim();
    const aliases = {pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'};
    const normalized = type === 'application/x-pdf' ? 'application/pdf' : !type || ['application/octet-stream','binary/octet-stream','*/*'].includes(type) ? aliases[fileName.split('.').pop().toLowerCase()] || '' : type;
    if (!blob.size || blob.size > 20 * 1024 * 1024 || !(normalized === 'application/pdf' || normalized.startsWith('image/'))) throw new Error('Choose one image or PDF, up to 20 MB.');
    const signed = await api('/files/presign', 'POST', {accessLevel:'PRIVATE',fileName,kind:kind(),mimeType:normalized,sizeBytes:blob.size});
    if (cancelled) return null;
    const result = await fetch(signed.presignedUrl, {method:'PUT',body:blob,headers:{'Content-Type':normalized},signal:AbortSignal.timeout(60000)});
    if (!result.ok) throw new Error('Receipt upload failed. Try again.');
    await api('/files/' + signed.assetId + '/complete', 'POST', {});
    return signed.assetId;
  }
  async function open() {
    if (saving || cancelled || opening) return;
    opening = true;
    $('pick').disabled = true;
    $('error').hidden = true; $('retry').hidden = true; $('scan').hidden = false; $('save').disabled = true; $('send').disabled = true;
    $('status').textContent = 'Reading receipt…';
    $('pick').hidden = true;
    try {
      if (!loaded) {
        if (native) { const info = await bridge('init'); fileName = info.fileName; requestId = info.requestId; }
        else if (!blob && shareKey) {
          const cache = await caches.open('hostelpalika-shared-payments-v1');
          const response = await cache.match(shareKey);
          if (!response || Number(response.headers.get('x-shared-at')) < Date.now() - 3600000) throw new Error('This share expired. Choose the receipt again.');
          blob = await response.blob(); fileName = decodeURIComponent(response.headers.get('x-file-name') || 'receipt');
        }
        if (!native && !blob) {
          const messages = {missing:'Couldn’t get the file from that app. Save it, then tap Select receipt.', multiple:'Share one receipt at a time.', empty:'The shared file is empty.', oversized:'Choose a receipt under 20 MB.', unsupported:'This file type isn’t supported.', unavailable:'Couldn’t get the file from that app. Save it, then tap Select receipt.', large:'Open the app, then share again.'};
          $('status').textContent = messages[params.get('error')] || 'Select an image or PDF.';
          $('pick').hidden = false; return;
        }
        if (!native) {
          const hash = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
          requestId = 'receipt-' + Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2,'0')).join('').slice(0,56);
        }
        const me = await api('/auth/me');
        const account = me.user || me;
        resident = account.role === 'RESIDENT';
        if (resident) { $('title').textContent = 'Send payment proof'; }
        else {
          if (!['HOSTEL_ADMIN','WARDEN'].includes(account.role)) throw new Error('Sign in as a resident or hostel staff to use this receipt.');
          $('title').textContent = 'Add expense';
          const hostel = native ? await bridge('hostel') : branch();
          prefKey = `hostelpalika.receipt-auto:${account.id}:${hostel || account.hostelIds?.[0] || ''}`;
          $('auto').checked = native ? await bridge('preference', {key:prefKey}) : localStorage.getItem(prefKey) === 'true';
        }
        loaded = true;
      }
      $('file').textContent = fileName; $('file').hidden = !fileName;
      if (resident) return await openResident();
      if (!assetId) { $('status').textContent = 'Uploading receipt…'; assetId = await upload(); }
      if (cancelled || !assetId) return;
      $('status').textContent = 'Reading receipt…';
      const result = await api('/hostel-admin/expenses/receipt/read','POST',{assetId});
      if (cancelled) return;
      if (result.alreadySaved) { const saved = result.alreadySaved; finish('Already added', 'Rs. ' + saved.amount.toLocaleString('en-IN') + (saved.by ? ' · added by ' + saved.by : '') + (saved.where ? ' in ' + saved.where : '')); return; }
      $('amount').value = result.fields.amount || '';
      bank = result.bank || null;
      $('method').value = ['ESEWA','KHALTI'].includes(result.fields.method) ? result.fields.method : 'BANK';
      $('methodAuto').hidden = !result.fields.method; drawPick('method');
      $('category').value = result.category || 'OTHER'; $('categoryAuto').hidden = !result.category;
      $('what').value = result.description || 'Shared payment receipt';
      $('form').hidden = false; $('save').hidden = false; $('save').disabled = false;
      $('status').textContent = result.fields.amount ? 'Ready to save' : 'Enter amount';
      if ($('auto').checked && result.autoSaveEligible === true && $('form').checkValidity()) await save(true);
    } catch (e) {
      if (!cancelled) {
        $('status').textContent = 'Couldn’t read receipt'; error(e.message || 'Try again.'); $('retry').hidden = false; if (!native) $('pick').hidden = false;
        if (assetId && !resident) { $('form').hidden = false; $('save').hidden = false; $('save').disabled = false; $('what').value ||= 'Shared payment receipt'; }
        if (assetId && resident && due.length) { $('rform').hidden = false; $('send').hidden = false; $('send').disabled = false; }
      }
    }
    finally { opening = false; $('pick').disabled = false; $('scan').hidden = true; }
  }
  // ---- Residents: read the receipt, match it to an unpaid month, send it to the hostel.
  // No auto-save here: rent is paid once a month, and a claim is always looked at first.
  const MONTHS = ['Baisakh','Jestha','Asar','Shrawan','Bhadra','Aswin','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];
  const rupees = amount => 'Rs ' + Number(amount || 0).toLocaleString('en-IN');
  function monthName(month) { const [year, number] = String(month || '').split('-'); return MONTHS[Number(number) - 1] ? MONTHS[Number(number) - 1] + ' ' + year : 'Invoice'; }
  const NEEDS_ID = ['ESEWA','KHALTI','FONEPAY','BANK_TRANSFER'];
  function chosen() { return due.find(invoice => invoice.id === $('rinvoice').value) || due[0]; }
  function showInvoice() {
    const invoice = chosen(); if (!invoice) return;
    $('forMonth').textContent = monthName(invoice.month); $('forDue').textContent = rupees(invoice.dueAmount) + ' due';
  }
  function methodChanged() {
    const cash = $('rmethod').value === 'CASH';
    $('rtxn').required = NEEDS_ID.includes($('rmethod').value);
    $('rtxn').placeholder = cash ? 'Who took the cash' : 'From the receipt';

  const svg = path => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
  const GLYPHS = {bank:svg('<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>'), cash:svg('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'), other:svg('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'), none:svg('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>')};
  const NAMES = {ESEWA:'eSewa', KHALTI:'Khalti', FONEPAY:'Fonepay', CASH:'Cash', OTHER:'Other'};
  const CHOICES = {method:['BANK','ESEWA','KHALTI','CASH'], rmethod:['ESEWA','KHALTI','FONEPAY','BANK_TRANSFER','CASH','OTHER']};
  const isBank = value => value === 'BANK' || value === 'BANK_TRANSFER';
  const esc = text => String(text).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  let bank = null, menuFor = null;
  function mark(value) {
    const key = {ESEWA:'esewa', KHALTI:'khalti', FONEPAY:'fonepay'}[value] || (isBank(value) && bank ? bank.key : '');
    return '<span class="logo">' + (LOGOS[key] ? '<img alt="" src="' + LOGOS[key] + '">' : GLYPHS[value === 'CASH' ? 'cash' : value === 'OTHER' ? 'other' : value ? 'bank' : 'none']) + '</span>';
  }
  const label = value => isBank(value) ? (bank?.name || 'Bank') : NAMES[value] || 'Choose';
  function drawPick(id) { $(id + 'Pick').innerHTML = mark($(id).value) + '<span class="t">' + esc(label($(id).value)) + '</span><span class="chev">▾</span>'; }
  function openMenu(id) {
    menuFor = id;
    $('menuTitle').textContent = id === 'method' ? 'Paid by' : 'Paid with';
    $('menuList').innerHTML = CHOICES[id].map(value => '<button type="button" class="opt" role="option" data-value="' + value + '" aria-selected="' + ($(id).value === value) + '">' + mark(value) + '<span>' + esc(label(value)) + '</span>' + ($(id).value === value ? '<span class="tick">✓</span>' : '') + '</button>').join('');
    $(resident ? 'rform' : 'form').hidden = true; $('actions').hidden = true; $('menu').hidden = false;
  }
  function closeMenu(value) {
    const id = menuFor; if (!id) return; menuFor = null;
    $('menu').hidden = true; $(resident ? 'rform' : 'form').hidden = false; $('actions').hidden = false;
    // A choice the person made is no longer the receipt's: the Auto tag goes.
    if (value !== $(id).value) { $(id).value = value; $(id + 'Auto').hidden = true; if (id === 'rmethod') methodChanged(); }
    drawPick(id);
  }
  $('menuList').onclick = event => { const row = event.target.closest && event.target.closest('[data-value]'); if (row) closeMenu(row.getAttribute('data-value')); };
  $('methodPick').onclick = () => { if (!saving) openMenu('method'); };
  $('rmethodPick').onclick = () => { if (!saving) openMenu('rmethod'); };
  $('category').onchange = () => { $('categoryAuto').hidden = true; };
  drawPick('method'); drawPick('rmethod');
  $('rinvoice').onchange = showInvoice;
  $('rmethod').onchange = methodChanged;
  function refused(text) {
    finish('Can’t use this receipt', text, true);
    void notify('Receipt not sent', text);
  }
  async function notify(title, text) { if (native) await bridge('notice', {title, text}).catch(() => {}); }
  async function openResident() {
    // The invoice list and the upload do not depend on each other; the read waits for the upload.
    const invoices = due.length ? null : api('/resident/finance/invoices').then(view => {
      due = (view.invoices || []).filter(invoice => invoice.dueAmount > 0)
        .sort((a, b) => String(a.month || '9999').localeCompare(String(b.month || '9999')));
    });
    invoices?.catch(() => {});
    if (!assetId) { $('status').textContent = 'Uploading receipt…'; assetId = await upload(); }
    if (cancelled || !assetId) return;
    $('status').textContent = 'Reading receipt…';
    const [read] = await Promise.all([api('/resident/finance/evidence/' + assetId + '/read?format=json', 'POST'), invoices]);
    if (cancelled) return;
    if (!due.length) { finish('Nothing to pay', 'You have no unpaid invoices right now.'); return; }
    if (read.systemDocument) return refused('That is a receipt from your hostel. Share the one from the app you paid with.');
    if (read.notPayment) return refused('This doesn’t look like a payment. Share the receipt from the app you paid with.');
    if (read.refusal) return refused(read.refusal);
    const amount = read.fields?.amount;
    const match = due.find(invoice => invoice.dueAmount === amount) || due[0];
    $('rinvoice').options.length = 0;
    for (const invoice of due) $('rinvoice').add(new Option(monthName(invoice.month) + ' · ' + rupees(invoice.dueAmount), invoice.id));
    $('rinvoice').value = match.id;
    $('pickInvoice').hidden = due.length < 2; $('for').hidden = due.length > 1;
    showInvoice();
    $('ramount').value = amount || match.dueAmount;
    bank = read.bank || null;
    $('rmethod').value = read.fields?.method || '';
    $('rmethodAuto').hidden = !$('rmethod').value; drawPick('rmethod');
    $('rtxn').value = read.fields?.transactionCode || '';
    methodChanged();
    const hint = read.statementGuidance || (read.text === false ? 'We couldn’t read it. Check the amount and add the ID.' : '');
    $('hint').textContent = hint; $('hint').hidden = !hint;
    $('rform').hidden = false; $('send').hidden = false; $('send').disabled = false;
    $('status').textContent = read.text === false ? 'Check the details' : 'Ready to send';
  }
  async function send() {
    if (saving || cancelled || !assetId) return;
    if (!$('rmethod').value) { error('Choose how you paid.'); openMenu('rmethod'); return; }
    if (!$('rform').reportValidity()) return;
    const invoice = chosen();
    saving = true; $('send').disabled = true; $('cancel').disabled = true; $('retry').hidden = true; $('error').hidden = true;
    $('status').textContent = 'Sending to your hostel…';
    try {
      const amount = Number($('ramount').value);
      const result = await api('/resident/finance/invoices/' + invoice.id + '/claims', 'POST', {amount, paymentMethod:$('rmethod').value, proofImageAssetId:assetId, transactionCode:$('rtxn').value.trim() || undefined});
      finish(result?.created === false ? 'Already sent' : 'Sent to your hostel', rupees(amount) + ' for ' + monthName(invoice.month) + '. You’ll get a notification when it’s confirmed.');
    } catch (e) { error(e.message || 'Not sent. Try again.'); $('status').textContent = 'Your receipt is ready to send.'; $('send').disabled = false; $('cancel').disabled = false; }
    finally { saving = false; }
  }
  $('rform').onsubmit = event => { event.preventDefault(); void send(); };
  // ---- Staff: save the receipt as a hostel expense.
  async function save(automatic = false) {
    if (saving || cancelled || !assetId || !$('form').reportValidity()) return;
    saving = true; $('save').disabled = true; $('cancel').disabled = true; $('retry').hidden = true; $('error').hidden = true;
    $('status').textContent = automatic ? 'Saving your receipt…' : 'Saving expense…';
    try {
      await api('/hostel-admin/expenses','POST',{amount:Number($('amount').value),category:$('category').value,paidBy:$('method').value,what:$('what').value.trim(),photoAssetId:assetId,clientRequestId:requestId,sharedReceipt:true});
      // Preference only changes after a successful explicit save, scoped to account + branch.
      if (!automatic) {
        try {
          if (native) await bridge('preference', {key:prefKey,enabled:$('auto').checked});
          else localStorage.setItem(prefKey,String($('auto').checked));
        } catch { error('Expense saved. Auto-save setting could not be changed.'); }
      }
      finish('Saved', '');
      if (automatic) setTimeout(() => { void close(); }, 650);
    } catch (e) { error(e.message || 'Not saved. Try again.'); $('status').textContent = 'Your receipt is ready to save.'; $('save').disabled = false; $('cancel').disabled = false; }
    finally { saving = false; }
  }
  function finish(title, text, bad = false) {
    void cleanup().catch(() => {});
    $('doneTitle').textContent = title; $('doneText').textContent = text;
    $('doneIcon').textContent = bad ? '✕' : '✓'; $('doneIcon').className = bad ? 'bad' : '';
    $('form').hidden = true; $('rform').hidden = true; $('pick').hidden = true; $('done').hidden = false; $('status').textContent = ''; $('save').hidden = true; $('send').hidden = true; $('scan').hidden = true;
    $('cancel').textContent = 'Done'; $('cancel').disabled = false;
  }
  $('form').onsubmit = event => { event.preventDefault(); void save(); };
  void open();
})();
</script></main></body></html>
