<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the installed app draws under the notch, and the safe-area insets pad it back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The installable web app. One manifest for the whole site (apps/web/src/app/manifest.ts); it starts here, at /app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="icon" href="/icon.png" />
    <!-- The screen's background, so the status and navigation bars disappear into the app, light and dark. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HostelPalika" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      /* RGB channels, like src/global.css (whose :root replaces these once the app's CSS loads) — read as rgb(var(--x)). */
      :root {
        --background: 255 255 255;
        --foreground: 28 25 23;
        --card: 255 255 255;
        --primary: 10 138 75;
        --muted-foreground: 120 113 108;
        --border: 231 229 228;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: 12 10 9;
          --foreground: 250 250 249;
          --card: 28 25 23;
          --primary: 18 169 93;
          --muted-foreground: 168 162 158;
          --border: 41 37 36;
        }
      }
      body {
        overflow: hidden;
        background: rgb(var(--background));
      }
      /* Match the phone. NativeWind sizes text in rem, and on the phone a rem is 14px, not the browser's 16px. */
      html {
        font-size: 14px;
      }
      /* Yoga never shrinks a view or text unless told to; CSS does by default. Zero specificity, so any class or style that asks to shrink still wins. */
      :where(#root [dir]) {
        flex-shrink: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* It is a phone app. On a wide screen it stays phone-shaped rather than stretching a tab bar across a monitor. */
      @media (min-width: 640px) {
        #root {
          max-width: 480px;
          margin: 0 auto;
          box-shadow: 0 0 0 1px rgb(var(--border));
        }
      }

      /* The install and notification sheets: the app's own bottom sheet, drawn by the shell so the app code knows nothing of it. */
      .pwa-sheet[hidden] { display: none; }
      .pwa-sheet {
        position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: flex-end; justify-content: center;
        background: rgba(0, 0, 0, 0.4); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .pwa-sheet .sheet {
        width: 100%; max-width: 480px; box-sizing: border-box; background: rgb(var(--card)); color: rgb(var(--foreground));
        border-radius: 24px 24px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
      }
      .pwa-sheet .handle { width: 40px; height: 4px; border-radius: 2px; background: rgb(var(--border)); margin: 0 auto 16px; }
      .pwa-sheet h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
      .pwa-sheet .app { display: flex; align-items: center; gap: 12px; }
      .pwa-sheet .app img { width: 52px; height: 52px; border-radius: 14px; }
      .pwa-sheet .app b { display: block; font-size: 16px; font-weight: 500; }
      .pwa-sheet .app span { font-size: 14px; color: rgb(var(--muted-foreground)); }
      .pwa-sheet ol { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
      .pwa-sheet li { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
      .pwa-sheet li i {
        flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: rgb(var(--primary));
        background: rgb(var(--primary) / 0.1);
      }
      .pwa-sheet button {
        margin-top: 20px; width: 100%; height: 48px; border: 0; border-radius: 12px; background: rgb(var(--primary)); color: #fff;
        font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      .pwa-sheet button.later { margin-top: 8px; background: transparent; color: rgb(var(--muted-foreground)); }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <div id="install" class="pwa-sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="install-title">
        <div class="handle"></div>
        <h2 id="install-title">Install HostelPalika</h2>
        <div class="app">
          <img src="/icon.png" alt="" />
          <div><b>HostelPalika</b><span>Opens full screen from your home screen, like any app.</span></div>
        </div>
        <ol data-ios hidden>
          <li>
            <i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg></i>
            Tap Share in the browser bar
          </li>
          <li>
            <i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg></i>
            Choose Add to Home Screen, then Add
          </li>
        </ol>
        <button type="button" data-action>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-android><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Install app</span>
        </button>
        <button type="button" class="later" data-later>Not now</button>
      </div>
    </div>

    <div id="notify" class="pwa-sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="notify-title">
        <div class="handle"></div>
        <h2 id="notify-title">Turn on notifications</h2>
        <div class="app">
          <i style="flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:rgb(var(--primary));background:rgb(var(--primary) / 0.1)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></i>
          <div><b>Rent, payments and notices</b><span>Due dates, payment updates and hostel notices as they happen.</span></div>
        </div>
        <button type="button" data-action>Turn on notifications</button>
        <button type="button" class="later" data-later>Not now</button>
      </div>
    </div>

    <script>
      /*
       * Offers to put the app on the home screen, the same on Android and iPhone.
       * Android's browser hands over its install prompt, which "Install app" fires.
       * iPhone has no install API, only Share → Add to Home Screen, so the sheet shows
       * those two steps. Hidden once installed; "Not now" is remembered; `?install`
       * (the website's Install button) opens it regardless.
       */
      /* One sheet at a time: a second waits until the first is closed. */
      var sheetQueue = [];
      function show(el) {
        if (document.querySelector(".pwa-sheet:not([hidden])")) {
          if (sheetQueue.indexOf(el) < 0) sheetQueue.push(el);
        } else {
          el.hidden = false;
        }
      }
      function hide(el) {
        el.hidden = true;
        var next = sheetQueue.shift();
        if (next) next.hidden = false;
      }

      (function () {
        var KEY = "pwa-install-dismissed";
        var sheet = document.getElementById("install");
        var installed =
          matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
        var ios =
          /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var dismissed = false;
        try { dismissed = localStorage.getItem(KEY) === "1"; } catch (e) {}
        var wanted = /[?&]install(=|&|$)/.test(location.search) || !dismissed;
        var prompt = null;

        function close() {
          hide(sheet);
          try { localStorage.setItem(KEY, "1"); } catch (e) {}
        }

        sheet.addEventListener("click", function (event) { if (event.target === sheet) close(); });
        sheet.querySelector("[data-later]").addEventListener("click", close);
        sheet.querySelector("[data-action]").addEventListener("click", function () {
          if (prompt) prompt.prompt();
          prompt = null;
          close();
        });
        addEventListener("appinstalled", function () { if (!sheet.hidden) hide(sheet); });

        if (installed) return;

        if (ios) {
          sheet.querySelector("[data-ios]").hidden = false;
          sheet.querySelector("[data-android]").remove();
          sheet.querySelector("[data-action] span").textContent = "Got it";
          sheet.querySelector("[data-later]").remove();
          if (wanted) show(sheet);
          return;
        }

        addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          prompt = event;
          if (wanted) show(sheet);
        });
      })();

      /*
       * Asks for notifications once, when the app first opens signed in (push needs
       * an account). web/push-notifications.ts raises `pwa-ask-notifications` after
       * boot, so this never covers the splash. Browsers show their own
       * permission prompt only for a tap (iPhone strictly so), so the sheet's button
       * is that tap; the browser then keeps the answer itself, and this remembers
       * that it asked. A grant is announced to the app (web/push-notifications.ts),
       * which subscribes straight away when someone is signed in, or at sign-in.
       * iPhone offers push only to the app on the Home Screen, so a Safari tab
       * never sees this.
       */
      (function () {
        var KEY = "pwa-notify-asked";
        var sheet = document.getElementById("notify");
        var asked = false;
        try { asked = localStorage.getItem(KEY) === "1"; } catch (e) {}
        var supported = "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;

        if (asked || !supported) return;

        function close() {
          hide(sheet);
          try { localStorage.setItem(KEY, "1"); } catch (e) {}
        }

        sheet.addEventListener("click", function (event) { if (event.target === sheet) close(); });
        sheet.querySelector("[data-later]").addEventListener("click", close);
        sheet.querySelector("[data-action]").addEventListener("click", function () {
          close();
          Notification.requestPermission().then(function (permission) {
            if (permission === "granted") dispatchEvent(new Event("pwa-notifications-granted"));
          });
        });

        addEventListener("pwa-ask-notifications", function () {
          var stillAsked = false;
          try { stillAsked = localStorage.getItem(KEY) === "1"; } catch (e) {}
          if (!stillAsked && Notification.permission === "default") show(sheet);
        });
      })();
    </script>
  </body>
</html>
