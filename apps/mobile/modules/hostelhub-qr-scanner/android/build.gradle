plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.softmato.hostelhub'
version = '1.0.0'

android {
  namespace "com.softmato.hostelhub.qrscanner"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// The same override expo-camera carries: React Native's Guava forces
// listenablefuture to the intentionally empty 9999.0 jar, and CameraX needs the
// real ListenableFuture class to compile.
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

dependencies {
  // The versions expo-camera already ships, so Gradle resolves one copy of each
  // and this module adds no weight to the APK.
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
