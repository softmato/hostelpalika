name: Go server

# test → image → deploy.
#   test:   gofmt, vet, race tests with Mongo + Redis, staticcheck, govulncheck.
#   image:  builds server/deploy/Dockerfile once, boots it read-only against a throwaway
#           Mongo + Redis, and (on main) pushes ghcr.io/softmato/hostelpalika-api:<sha>.
#   deploy: rolls the VPS to that sha with server/deploy/deploy.sh. Off until the repo
#           variable DEPLOY_ENABLED is "true" (server/docs/RUNBOOK.md §1).
# Rollback: Actions → Go server → Run workflow with an older sha; test and image are
# skipped and that already-built image is rolled out.
# Run workflow on another branch with no sha tests, builds and deploys that branch:
# a deliberate release that is not on main yet (web-on-go before the web cut-over).

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Commit sha to deploy (rollback). Empty: test, build and deploy this commit."
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/softmato/hostelpalika-api

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      redis:
        image: redis:7
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: System libraries (libvips, poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev poppler-utils pkg-config
      # The contract fixtures dial a replica set on 27018 (MEMORY.md).
      # 7.0, not 8.0: every 8.x refuses to start on the runner's kernel, 6.19 or newer
      # (SERVER-121912). The suite uses nothing specific to 8.
      - name: Start Mongo
        run: |
          docker run -d --name mongo -p 27018:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}).ok }' && exit 0
            sleep 2
          done
          docker logs mongo | tail -40
          exit 1
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      # A skipped contract suite must not pass as green: without Mongo it skips.
      - name: Test with the race detector
        shell: bash
        run: |
          set -o pipefail
          GIN_MODE=release go test -race -tags=sonic -timeout 45m -v ./... | tee test.txt | grep -E '^(ok|FAIL|panic)|--- FAIL|^ +[a-z_]+_test\.go:[0-9]+:'
          ! grep -E -- '--- SKIP: (TestContract|TestAnonymousIsRefused)' test.txt
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Deploy script
        run: shellcheck deploy/deploy.sh deploy/vps-setup.sh

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Layer and Go build caches persist between runs (type=gha), so a commit that
      # touches only Go code rebuilds only the compile layer.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/deploy/Dockerfile
          build-args: REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # The image exactly as production runs it (read-only root, tmpfs /tmp, no
      # capabilities) must boot, answer deep health, and run pdftotext.
      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name mongo --network smoke mongo:7.0
          docker run -d --name redis --network smoke redis:7
          # Throwaway values: config refuses to boot without them, and they open nothing real.
          printf 'APP_ENV=development\nAPP_URL=http://localhost:8080\nJWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\nMONGODB_URI=mongodb://mongo:27017/smoke\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > smoke.env
          docker run -d --name api --network smoke -p 8080:8080 \
            --read-only --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --env-file smoke.env -e HOME=/tmp -e API_ADDR=:8080 -e REDIS_URL=redis://redis:6379/0 \
            "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8080/api/v1/health?deep=1' && break
            sleep 2
          done
          curl -fsS 'http://127.0.0.1:8080/api/v1/health?deep=1'
          docker logs api 2>&1 | grep -F "\"revision\":\"$GITHUB_SHA\""
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL -e HOME=/tmp \
            -v "$PWD/server/internal/modules/hostels/agreement-letterhead.pdf:/in.pdf:ro" \
            --entrypoint pdftotext "$IMAGE:$GITHUB_SHA" -q /in.pdf - >/dev/null
          docker run --rm --network smoke --read-only --cap-drop ALL --env-file smoke.env \
            --entrypoint indexes "$IMAGE:$GITHUB_SHA" -dry-run | tail -3
          # ops ships in the image: its usage lists the commands.
          docker run --rm --entrypoint ops "$IMAGE:$GITHUB_SHA" 2>&1 | grep -q rotate-finance-key
          docker image ls "$IMAGE"
      - name: Smoke logs
        if: failure()
        run: docker logs api 2>&1 | tail -80 || true
      - name: Push
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: image
    # Runs after a green image from a push to main or a Run workflow, or alone for a
    # rollback sha.
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      (needs.image.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '' && needs.image.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/deploy
      - name: SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -p $VPS_PORT -o BatchMode=yes $VPS_USER@$VPS_HOST" >> "$GITHUB_ENV"
      - name: Copy deploy files
        run: |
          $SSH 'mkdir -p ~/hostelpalika/incoming'
          scp -P "$VPS_PORT" -o BatchMode=yes server/deploy/{compose.yaml,Caddyfile,redis.conf,redis-cache.conf,deploy.sh} \
            "$VPS_USER@$VPS_HOST:hostelpalika/incoming/"
      # The job's own token, valid only while this job runs: nothing long-lived on the VPS.
      - name: Registry login on the VPS
        run: echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
      - name: Roll out
        run: $SSH "bash ~/hostelpalika/incoming/deploy.sh $TAG"
      - name: Registry logout
        if: always()
        run: $SSH 'docker logout ghcr.io' || true
