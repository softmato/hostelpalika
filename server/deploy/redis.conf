# Locks, rate limits and hostel cache versions only — nothing here must survive a
# restart, and nothing here may be evicted: those keys carry TTLs, so volatile-lru
# dropped them under a cache flood (P11-16). Cached bodies live in redis-cache.
bind 0.0.0.0
# Not published to the host; only containers on the backend network reach it.
# The password is passed on the command line (compose.yaml, REDIS_PASSWORD).
protected-mode no
maxmemory 48mb
# Full = writes fail: the limiter then counts in memory, never silently forgets.
maxmemory-policy noeviction
save ""
appendonly no
